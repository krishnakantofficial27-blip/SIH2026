[project]
name = "landslide-warning-api"
version = "1.0.0"
description = "Landslide Early Warning System - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "python-multipart>=0.0.19",
    "numpy>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
]

[tool.vercel]
entrypoint = "app.main:app"
