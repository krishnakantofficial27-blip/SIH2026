databases:
  - name: landslide-db
    databaseName: landslide
    plan: free

services:
  - type: web
    name: landslide-warning-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: sqlite:///./landslide.db
    plan: free
